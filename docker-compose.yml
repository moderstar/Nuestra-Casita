services:
  dashboard-api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CASITA_API_HOST: 0.0.0.0
      CASITA_API_PORT: 8080
    expose:
      - "8080"
    networks:
      - default
      - postgres
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  kitchen-dashboard:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      dashboard-api:
        condition: service_healthy
    ports:
      - "${CASITA_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${CASITA_FRONTEND_PORT:-8085}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  postgres:
    external: true
    name: n8n_n8n-network
